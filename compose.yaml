# 로컬 개발용. 값은 .env에서 읽는다.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: recapstone
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    labels:
      org.springframework.boot.service-connection: postgres
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
