# 로컬 개발용. 값은 .env에서 읽는다.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: recapstone
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    labels:
      org.springframework.boot.service-connection: postgres
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
  # 개발용 메일 수신함. 보낸 메일은 http://localhost:8025 에서 본다
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  # 파일 저장소 (S3 호환, DESIGN_REVIEW.md 6.8). 버킷과 CORS는 앱이 시작할 때 만든다 (local 프로필)
  rustfs:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
