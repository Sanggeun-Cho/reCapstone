spring:
  flyway:
    locations: classpath:db/migration,classpath:db/test-migration

app:
  cors:
    allowed-origins: http://localhost:3000
  auth:
    frontend-url: http://localhost:3000
    # 테스트 전용 고정 키 (비밀값 아님)
    totp-encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  group:
    # 테스트에서는 영구 삭제 작업을 직접 호출한다
    purge-cron: "-"
  storage:
    # 테스트에서는 정리 작업을 직접 호출한다. 저장소 주소와 키는 TestcontainersConfiguration이 넣는다
    cleanup-cron: "-"
    bucket: recapstone-test
    path-style: true
    auto-create-bucket: true
    cors-origins: http://localhost:3000
