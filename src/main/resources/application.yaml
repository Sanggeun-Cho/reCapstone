# 비밀값은 환경변수(.env)로만 주입한다. 키 목록은 .env.example을 따른다.
spring:
  application:
    name: reCapstone
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recapstone}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
  session:
    # 미사용 만료 (정책 7.4 제2항). 절대 수명은 app.auth.session-absolute-timeout
    timeout: ${SESSION_IDLE_TIMEOUT:P14D}
    data:
      redis:
        # 사용자별 세션 조회(기기 관리)에 색인이 필요하다
        repository-type: indexed
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath*:com/back/**/query/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  override-with-generic-response: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  auth:
    frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
    mail-from: ${MAIL_FROM:no-reply@recapstone.local}
    totp-encryption-key: ${TOTP_ENCRYPTION_KEY:}
    session-absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT:P30D}

---
spring:
  config:
    activate:
      on-profile: local
  docker:
    compose:
      lifecycle-management: start-only

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
