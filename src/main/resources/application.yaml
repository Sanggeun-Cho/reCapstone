# 비밀값은 환경변수(.env)로만 주입한다. 키 목록은 .env.example을 따른다.
spring:
  application:
    name: reCapstone
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recapstone}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath*:com/back/**/query/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  override-with-generic-response: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

---
spring:
  config:
    activate:
      on-profile: local
  docker:
    compose:
      lifecycle-management: start-only

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
